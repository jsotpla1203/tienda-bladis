spring.application.name=bladis

# Mensajes de error
spring.web.error.include-message=always

# Configuracion de Firebase y administradores
firebase.credentials.path=classpath:firebase-service-account.json
tienda.admins=admin@tienda.com

# Máximo de unidades del mismo videojuego por carrito
tienda.carrito.max-unidades-por-producto=5

# Coste de envío estándar
tienda.envio.coste=3.99

# Envío gratuito a partir de 60 €
tienda.envio.gratis-desde=60.00